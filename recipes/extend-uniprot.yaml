# Your track layered on top of the FULL UniProt viewer.
#
# `extends:` pulls in the canonical UniProt configuration — all its
# sources, its ~15 annotation groups, and its colour themes — so you
# declare only what you are adding. Everything below `rows:` is
# appended to that base rather than replacing it.
#
# The `extends:` URL is pinned to an exact release, and it is the same
# version index.html loads the component from. Keep the two in step: a
# config written for one release is not guaranteed to merge cleanly
# into another. It resolves over the network like any other URL, so
# this recipe needs internet access.
#
# To use this recipe, copy it over config.yaml — or open
# index.html?config=recipes/extend-uniprot.yaml to preview it without
# editing anything.
$schema: https://ebi-webcomponents.github.io/protvista/schema/v1/config.schema.json
accession: P05067
extends: https://cdn.jsdelivr.net/npm/protvista-uniprot@5.0.0-beta.5/dist/default-config.yaml
sources:
  uniprot_features: https://www.ebi.ac.uk/proteins/api/features/{accession}

theme:
  labelColor: '#fff2cc'
  accentColor: '#b8860b'
  
rows:
  - id: EPITOPE
    hidden: true
    
  - id: MY_LAB
    label: My lab
    tracks:
      - id: live_uniprot_domains
        label: Live UniProt domains
        kind: features
        data: uniprot_features
        filter: DOMAIN
        
      - id: hotspots
        label: Hotspots
        kind: features
        data: ./data/hotspots.csv
        dataTooltip: |
          **{% $description %}**
          Type: {% $type %}
          Position: {% $start %}–{% $end %}
        
      - id: predictions
        label: Predictions
        kind: features
        data: ./data/predictions.csv
        description: Practice predictions

      - id: hotspots_json
        label: Hotspots JSON
        kind: features
        data: ./data/hotspots.json

      - id: regions_bed
        label: Regions BED
        kind: features
        data: ./data/regions.bed
        rendering:
          color: '#2e86c1'
          shape: roundRectangle
          
      - id: hotspots_domains
        label: Hotspots domains
        kind: features
        data: ./data/hotspots.csv
        filter: DOMAIN

      - id: hotspots_binding
        label: Hotspots binding sites
        kind: features
        data: ./data/hotspots.csv
        filter: BINDING
          
      - id: conservation
        label: Conservation
        kind: linegraph
        data: ./data/conservation.csv

      - id: my_variants
        label: My variants
        kind: variants
        data: ./data/my-variants.csv
